name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2; pinning prevents a mutable action tag from changing release behavior.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # v5.6.0; updated through reviewed Dependabot pull requests.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate plugin manifest JSON
        run: python3 -m json.tool .codex-plugin/plugin.json > /dev/null
      - name: Run test suite
        run: python3 -m unittest discover -v -s tests
      - name: Validate tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')"
          test "$TAG" = "v$VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
