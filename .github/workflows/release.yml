name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate plugin manifest JSON
        run: python3 -m json.tool .codex-plugin/plugin.json > /dev/null
      - name: Run test suite
        run: python3 -m unittest discover -v -s tests
      - name: Validate tag matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')"
          test "$TAG" = "v$VERSION"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
