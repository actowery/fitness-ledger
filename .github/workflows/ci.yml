name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin manifest JSON
        run: python3 -m json.tool .codex-plugin/plugin.json > /dev/null
      - name: Run test suite
        run: python3 -m unittest discover -v -s tests
      - name: Check tracked files for whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
