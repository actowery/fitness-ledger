name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # v4.2.2; pinning prevents a mutable action tag from changing CI behavior.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v5.6.0; updated through reviewed Dependabot pull requests.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin manifest JSON
        run: python3 -m json.tool .codex-plugin/plugin.json > /dev/null
      - name: Run test suite
        run: python3 -m unittest discover -v -s tests
      - name: Check tracked files for whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
