name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # v4.2.2; pinning prevents a mutable action tag from changing CI behavior.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v5.6.0; updated through reviewed Dependabot pull requests.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate plugin manifest JSON
        run: python3 -m json.tool .codex-plugin/plugin.json > /dev/null
      - name: Run test suite
        run: python3 -m unittest discover -v -s tests
      - name: Check tracked files for whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
